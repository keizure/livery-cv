<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livery CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 24px 64px;
    }

    /* Ambient glow behind hero */
    body::before {
      content: '';
      position: fixed;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse at center, rgba(201,168,126,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      max-width: 1160px;
      margin: 0 auto;
    }

    /* ─── HERO ─── */
    .hero {
      text-align: center;
      margin-bottom: 20px;
      animation: fadeUp 0.65s ease both;
    }

    .brand {
      font-size: clamp(36px, 5vw, 52px);
    }

    .hero-rule {
      display: block;
      width: 36px;
      height: 1px;
      background: var(--accent);
      opacity: 0.45;
      margin: 9px auto 10px;
    }

    .hero-sub {
      font-size: 11.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ─── CONTROLS BAR ─── */
    .controls-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      animation: fadeUp 0.65s 0.08s ease both;
    }

    /* ─── THEME GRID ─── */
    .themes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 18px;
      animation: fadeUp 0.65s 0.16s ease both;
    }

    .theme-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.22s, box-shadow 0.22s, transform 0.22s;
    }

    .theme-card:hover {
      border-color: rgba(201,168,126,0.28);
      box-shadow:
        0 0 0 1px rgba(201,168,126,0.07),
        0 24px 52px rgba(0,0,0,0.65);
      transform: translateY(-5px);
    }

    /* ─── PREVIEW IFRAME ─── */
    .theme-preview {
      width: 100%;
      height: 320px;
      overflow: hidden;
      position: relative;
      background: #1b1b1f;
      cursor: pointer;
    }

    .preview-iframe {
      position: absolute;
      top: 0;
      left: 0;
      border: none;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    /* ─── CARD INFO ─── */
    .theme-info {
      padding: 17px 20px 20px;
      border-top: 1px solid var(--border);
    }

    .theme-name {
      font-size: 15.5px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 5px;
      letter-spacing: -0.01em;
    }

    .theme-description {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 15px;
    }

    .view-btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: transparent;
      border: 1px solid var(--accent-dim);
      color: var(--accent);
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 11.5px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }

    .view-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d0d10;
    }

    /* ─── STATE ─── */
    .loading {
      text-align: center;
      color: var(--muted);
      font-size: 12.5px;
      letter-spacing: 0.08em;
      padding: 60px;
      animation: fadeUp 0.65s ease both;
    }

    .error {
      background: rgba(220,70,70,0.07);
      border: 1px solid rgba(220,70,70,0.16);
      border-radius: 10px;
      padding: 28px;
      text-align: center;
      color: #e08080;
      margin: 0 auto;
      max-width: 480px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1 class="brand">Livery<span class="brand-cv">CV</span></h1>
      <span class="hero-rule"></span>
      <p class="hero-sub">选择语言与主题，预览或导出你的简历</p>
    </div>

    <div class="controls-bar">
      <button class="lang-btn active" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="en">English</button>
      <div id="version-divider" class="ctrl-sep" style="display:none"></div>
      <div id="version-selector" style="display:none; gap:8px; align-items:center;"></div>
    </div>

    <div id="themes-container" class="loading">Loading…</div>
  </div>

  <script type="module">
    let currentLang = 'zh';
    let currentVersion = 'default';

    async function loadThemes() {
      try {
        const response = await fetch('/themes/themes.json');
        if (!response.ok) throw new Error('Failed to load themes');
        const data = await response.json();
        return data.themes;
      } catch (error) {
        console.error('Error loading themes:', error);
        throw error;
      }
    }

    async function loadVersions() {
      try {
        const response = await fetch('/data/versions.json');
        if (!response.ok) return [{ id: 'default', label: '默认版' }];
        const data = await response.json();
        return data.versions;
      } catch {
        return [{ id: 'default', label: '默认版' }];
      }
    }

    function renderVersionSelector(versions) {
      const container = document.getElementById('version-selector');
      const divider = document.getElementById('version-divider');
      if (versions.length <= 1) {
        container.style.display = 'none';
        divider.style.display = 'none';
        return;
      }
      container.innerHTML = versions.map(v => `
        <button class="version-btn${v.id === currentVersion ? ' active' : ''}" data-version="${v.id}">${v.label}</button>
      `).join('');
      container.style.display = 'flex';
      divider.style.display = 'block';

      container.querySelectorAll('.version-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          container.querySelectorAll('.version-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentVersion = this.dataset.version;
          updateSelections();
        });
      });
    }

    const IFRAME_WIDTH = 800;
    const PREVIEW_HEIGHT = 320;

    function makeIframe(container, src) {
      const scale = container.offsetWidth / IFRAME_WIDTH;
      const iframeHeight = Math.ceil(PREVIEW_HEIGHT / scale);
      const el = document.createElement('iframe');
      el.className = 'preview-iframe';
      el.src = src;
      el.style.cssText = `width:${IFRAME_WIDTH}px;height:${iframeHeight}px;transform:scale(${scale});transform-origin:top left;`;
      return el;
    }

    function crossfade(container, newSrc) {
      const old = container.querySelector('iframe');
      const next = makeIframe(container, newSrc);
      next.style.opacity = '0';
      container.appendChild(next);
      next.addEventListener('load', () => {
        next.style.opacity = '1';
        if (old) setTimeout(() => old.remove(), 320);
      }, { once: true });
    }

    function updateSelections() {
      document.querySelectorAll('.view-btn').forEach(link => {
        const url = new URL(link.href, location.href);
        url.searchParams.set('lang', currentLang);
        url.searchParams.set('version', currentVersion);
        link.href = url.toString();
      });

      document.querySelectorAll('.theme-preview[data-theme]').forEach(container => {
        const themeId = container.dataset.theme;
        const src = `viewer.html?lang=${currentLang}&theme=${themeId}&version=${currentVersion}&embed=1`;
        if (container.querySelector('iframe')) {
          crossfade(container, src);
        } else {
          delete container.dataset.loaded;
        }
      });
    }

    function setupLazyPreviews() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const container = entry.target;
          if (container.dataset.loaded) return;

          const themeId = container.dataset.theme;
          const src = `viewer.html?lang=${currentLang}&theme=${themeId}&version=${currentVersion}&embed=1`;

          container.appendChild(makeIframe(container, src));
          container.dataset.loaded = '1';
          observer.unobserve(container);
        });
      }, { rootMargin: '200px' });

      document.querySelectorAll('.theme-preview[data-theme]').forEach(el => observer.observe(el));
    }

    function renderThemes(themes) {
      const container = document.getElementById('themes-container');
      container.innerHTML = `
        <div class="themes-grid">
          ${themes.map(theme => `
            <div class="theme-card" onclick="openTheme('${theme.id}')">
              <div class="theme-preview" data-theme="${theme.id}"></div>
              <div class="theme-info">
                <h3 class="theme-name">${theme.name}</h3>
                <p class="theme-description">${theme.description}</p>
                <a href="viewer.html?lang=${currentLang}&theme=${theme.id}&version=${currentVersion}"
                   class="view-btn"
                   onclick="event.stopPropagation()">查看简历</a>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    window.openTheme = function(themeId) {
      window.location.href = `viewer.html?lang=${currentLang}&theme=${themeId}&version=${currentVersion}`;
    };

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentLang = this.dataset.lang;
        updateSelections();
      });
    });

    async function init() {
      try {
        const [themes, versions] = await Promise.all([loadThemes(), loadVersions()]);
        renderVersionSelector(versions);
        renderThemes(themes);
        setupLazyPreviews();
      } catch (error) {
        const container = document.getElementById('themes-container');
        container.innerHTML = `
          <div class="error">
            <h2>加载失败</h2>
            <p style="margin-top:12px">${error.message}</p>
          </div>
        `;
      }
    }

    init();
  </script>
</body>
</html>
