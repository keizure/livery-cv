<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简历</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    /* ── Sidebar layout ── */
    @media screen {
      /* Dark canvas — overrides theme's light bg so sidebar and content share the same ground */
      body {
        padding-right: var(--sidebar-width) !important;
        background: var(--bg) !important;
      }
    }

    .viewer-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: var(--bg);
      border-left: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      padding: 24px 18px;
      z-index: 100;
      overflow-y: auto;
    }

    /* Brand — centered, larger than shared default */
    .sidebar-brand {
      font-size: 30px;
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
      opacity: 0.9;
      transition: opacity 0.18s;
    }
    .sidebar-brand:hover { opacity: 1; }

    /* Sidebar sections */
    .sidebar-section {
      margin-bottom: 20px;
    }

    .sidebar-label {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .sidebar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Sidebar rule between sections */
    .sidebar-rule {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 4px 0 20px;
    }

    /* Spacer pushes footer to bottom */
    .sidebar-spacer { flex: 1; }

    /* Export button */
    .sidebar-export-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: rgba(238, 238, 242, 0.65);
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: border-color 0.18s, color 0.18s;
      text-align: left;
    }
    .sidebar-export-btn:hover {
      border-color: var(--accent-dim);
      color: var(--accent);
    }
    .sidebar-export-btn svg {
      flex-shrink: 0;
      opacity: 0.7;
    }

    /* Resume fade transition */
    #resume { transition: opacity 0.22s ease; }

    /* Loading state */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    /* Print: hide sidebar, restore body padding */
    @media print {
      .viewer-sidebar { display: none !important; }
      body { padding-right: 0 !important; }
    }
  </style>
</head>
<body>
  <!-- Sidebar toolbar -->
  <aside class="viewer-sidebar" id="viewer-sidebar">
    <a href="/" class="brand sidebar-brand">Livery<span class="brand-cv">CV</span></a>

    <div class="sidebar-rule"></div>

    <div class="sidebar-section">
      <p class="sidebar-label">语言</p>
      <div class="sidebar-group">
        <button class="lang-btn" id="btn-zh" onclick="switchLang('zh')">中文</button>
        <button class="lang-btn" id="btn-en" onclick="switchLang('en')">English</button>
      </div>
    </div>

    <div class="sidebar-section" id="sidebar-version-section" style="display:none">
      <p class="sidebar-label">版本</p>
      <div class="sidebar-group" id="sidebar-version-btns"></div>
    </div>

    <div class="sidebar-spacer"></div>

    <button class="sidebar-export-btn" onclick="window.print()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      <span id="export-label">导出 PDF</span>
    </button>
  </aside>

  <div id="loading" class="loading">加载中…</div>
  <div class="container" id="resume"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const initLang = params.get('lang') || 'zh';
    const initVersion = params.get('version') || 'default';

    // Set initial active state for language buttons
    document.getElementById('btn-' + initLang)?.classList.add('active');

    function switchLang(newLang) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + newLang)?.classList.add('active');
      const ver = new URLSearchParams(window.location.search).get('version') || 'default';
      window._liveryRerender?.(newLang, ver);
    }

    function switchVersion(newVersion) {
      document.querySelectorAll('.version-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.version-btn[data-version="${newVersion}"]`)?.classList.add('active');
      const lang = new URLSearchParams(window.location.search).get('lang') || 'zh';
      window._liveryRerender?.(lang, newVersion);
    }

    // Embed mode: hide sidebar, equalise body padding
    if (params.get('embed') === '1') {
      document.getElementById('viewer-sidebar').style.display = 'none';
      const s = document.createElement('style');
      s.textContent = 'body { padding: 20px !important; }';
      document.head.appendChild(s);
    }

    // Estimate PDF page count after each render.
    //
    // Two sources of error in a naïve scrollHeight / A4_height calculation:
    //   1. Screen CSS adds padding to the container (e.g. 48px top + 48px bottom)
    //      that is stripped to 0 in print CSS → subtract computed paddingTop/Bottom.
    //   2. Browser default font is 16px; print CSS sets body to 11pt ≈ 14.67px.
    //      Screen content is ~9% taller than its print equivalent → multiply by
    //      (printFontPx / screenFontPx) to normalise to print height.
    //
    // A4 @page margin: 15mm top + 15mm bottom → content height = 267mm = ~1009px.
    const A4_CONTENT_PX = Math.round((297 - 30) / 25.4 * 96); // 1009
    const PRINT_FONT_PX  = 11 * 96 / 72;                       // 11pt → ~14.67px

    function updatePageCount() {
      const resumeEl = document.getElementById('resume');
      const el = document.getElementById('export-label');
      if (!resumeEl || !el) return;

      const cs = getComputedStyle(resumeEl);
      const paddingV = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      const screenFontPx = parseFloat(getComputedStyle(document.body).fontSize);
      const fontRatio = PRINT_FONT_PX / screenFontPx;

      const printHeight = (resumeEl.scrollHeight - paddingV) * fontRatio;
      const pages = Math.max(1, Math.ceil(printHeight / A4_CONTENT_PX));
      el.textContent = `导出 PDF (${pages}页)`;
    }
    window._liveryOnRender = updatePageCount;

    // Load versions and populate sidebar
    fetch('/data/versions.json')
      .then(r => r.json())
      .then(data => {
        const versions = data.versions;
        if (versions.length <= 1) return;
        const section = document.getElementById('sidebar-version-section');
        const group = document.getElementById('sidebar-version-btns');
        versions.forEach(v => {
          const btn = document.createElement('button');
          btn.className = 'version-btn' + (v.id === initVersion ? ' active' : '');
          btn.dataset.version = v.id;
          btn.textContent = v.label;
          btn.onclick = () => switchVersion(v.id);
          group.appendChild(btn);
        });
        section.style.display = 'block';
      })
      .catch(() => {});
  </script>

  <script type="module" src="/main.js"></script>
</body>
</html>
